<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#ffffff" />
    <title>Lab · VAR-Scope</title>
    <link rel="icon" type="image/png" href="/variscite-favicon.png" />
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/nav.css" />
    <link rel="stylesheet" href="/brand.css" />
    <link rel="stylesheet" href="/lab.css" />
  </head>
  <body>
    <div id="lab-shell" class="shell lab-page">
      <header class="topbar">
        <a class="brand" href="/" aria-label="VAR-Scope dashboard">
          <img
            class="brand-logo"
            src="/variscite-logo-black.svg"
            alt="Variscite"
          />
          <span class="brand-product"
            ><strong>Board Diagnostics</strong><small>VAR-SCOPE</small></span
          >
        </a>
        <nav class="main-nav" aria-label="Main navigation">
          <a href="/">Dashboard</a>
          <a href="/hardware.html">Hardware</a>
          <a href="/bsp.html">Board Support Package</a>
          <a href="/lab.html" aria-current="page">Lab</a>
          <a href="/diagnostics.html">Diagnostics</a>
          <a class="support-nav" href="/support.html">Support</a>
        </nav>
        <div class="status">
          <span class="pulse"></span><span id="connection">Connecting</span
          ><time id="clock">--:--:--</time>
        </div>
      </header>

      <section class="lab-toolbar" aria-label="Lab workspace">
        <div class="lab-title">
          <span>LAB</span>
          <strong>Explore, demonstrate, and validate</strong>
        </div>
        <nav class="lab-tabs" aria-label="Lab sections">
          <a href="/lab.html?view=performance" data-lab-view="performance"
            ><span>PERF</span>Performance</a
          >
          <a href="/lab.html?view=camera" data-lab-view="camera"
            ><span>CAM</span>Camera</a
          >
          <a href="/lab.html?view=demos" data-lab-view="demos"
            ><span>DEMO</span>Demos</a
          >
          <a href="/lab.html?view=guides" data-lab-view="guides"
            ><span>TEST</span>Test Guides</a
          >
        </nav>
      </section>

      <main id="lab-content" aria-live="polite">
        <section class="lab-loading">
          <span class="lab-loading-mark"></span>
          <div>
            <strong>Opening Lab</strong>
            <p>Loading the selected workspace…</p>
          </div>
        </section>
      </main>

      <footer class="lab-footer">
        <span>VAR-Scope Hardware Lab</span
        ><span>Local, capability-aware tools</span>
      </footer>
    </div>
    <script src="/lab.js" type="module"></script>
  </body>
</html>
